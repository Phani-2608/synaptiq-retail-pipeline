# Databricks Declarative Automation Bundle configuration.
#
# Validate and deploy with:
#
#   databricks bundle validate
#   databricks bundle deploy -t dev
#   databricks bundle deploy -t prod
#
# Notebook paths are relative to this databricks.yml file.

bundle:
  name: retail_daily_sales

variables:
  catalog:
    description: Target Unity Catalog for the deployed environment.
    default: retail

targets:
  # Development mode automatically pauses job triggers, preventing a
  # development deployment from processing shared production files.
  dev:
    mode: development
    default: true
    variables:
      catalog: retail_dev

  prod:
    mode: production
    variables:
      catalog: retail

resources:
  jobs:
    daily_sales_pipeline:
      name: retail_daily_sales_pipeline

      description: >
        Ingests incoming retail order and product-reference files,
        validates and deduplicates orders, quarantines invalid records,
        and rebuilds affected business dates in the Gold aggregate.

      # Monitor the root of the inbox volume rather than only orders/.
      #
      # Expected structure:
      #
      # /Volumes/<catalog>/landing/inbox/orders/
      # /Volumes/<catalog>/landing/inbox/reference/
      #
      # This allows a newly arriving order file or product-reference file
      # to trigger the complete pipeline.
      trigger:
        file_arrival:
          url: /Volumes/${var.catalog}/landing/inbox/

          # Wait briefly after the last detected change so files have time
          # to finish uploading before the job starts.
          wait_after_last_change_seconds: 30

          # Prevent several files arriving close together from creating
          # excessive overlapping job runs.
          min_time_between_triggers_seconds: 60

      # Only one pipeline run may modify the Silver and Gold tables at once.
      # Additional triggered runs are queued rather than discarded.
      max_concurrent_runs: 1

      queue:
        enabled: true

      timeout_seconds: 3600

      tasks:
        # -------------------------------------------------------------
        # Bronze ingestion
        # -------------------------------------------------------------
        - task_key: bronze_ingest

          description: >
            Uses Auto Loader to ingest previously unprocessed order files
            into the Bronze orders table.

          max_retries: 2
          min_retry_interval_millis: 30000
          retry_on_timeout: true

          notebook_task:
            notebook_path: ./01_bronze_ingest.py

            base_parameters:
              catalog: ${var.catalog}

        # -------------------------------------------------------------
        # Silver processing
        # -------------------------------------------------------------
        - task_key: silver

          description: >
            Parses incoming records, quarantines invalid records,
            deterministically deduplicates orders, records affected
            business dates, and upserts the latest order assertions.

          depends_on:
            - task_key: bronze_ingest

          notebook_task:
            notebook_path: ./02_silver.py

            base_parameters:
              catalog: ${var.catalog}

          # The notebook uses idempotent Delta MERGE operations, but a
          # failure may still indicate a schema, constraint, or data-quality
          # issue that should be inspected rather than repeatedly retried.
          max_retries: 0

        # -------------------------------------------------------------
        # Gold aggregation
        # -------------------------------------------------------------
        - task_key: gold

          description: >
            Builds and validates candidate aggregates for queued business
            dates, publishes only validated partitions, verifies the
            published result, and clears the refresh queue after success.

          depends_on:
            - task_key: silver

          notebook_task:
            notebook_path: ./03_gold.py

            base_parameters:
              catalog: ${var.catalog}

          # Validation failures are treated as correctness failures and
          # should remain visible for investigation.
          max_retries: 0

# No job_clusters block is required because these notebook tasks use
# Databricks serverless job compute in the target workspace.
